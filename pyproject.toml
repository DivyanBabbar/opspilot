[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "opspilot"
version = "1.0.0"
description = "A safety-gated self-healing infrastructure agent prototype."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "uvicorn[standard]>=0.34,<1"]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.11,<1"]
[project.scripts]
opspilot = "opspilot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
opspilot = ["static/*.html", "static/*.css", "static/*.js"]
[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E5", "E9", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
